# docker-compose.yml

name: recall

services:
  postgres:
    # pgvector's official image: Postgres 16 with the extension precompiled.
    # Alternative was postgres:16 plus building the extension ourselves —
    # more Dockerfile, no benefit.
    image: pgvector/pgvector:pg16
    container_name: recall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recall_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-recall}
      # Deterministic collation, so text ordering is identical everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # host:container — 5432 on the host is taken by a native Postgres,
      # so we publish on 5433. Inside the compose network it is still 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, the first time the volume is created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recall} -d ${POSTGRES_DB:-recall}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: recall-redis
    restart: unless-stopped
    # Redis is our job queue, pub/sub bus and cache. appendonly keeps queued
    # jobs across restarts; pub/sub is fire-and-forget either way.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
